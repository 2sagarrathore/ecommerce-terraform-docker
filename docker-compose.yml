# Local build-and-test harness for the five services. Mirrors the container
# topology that EC2 user-data creates: backends on 3001-3004, frontend on 3000
# published as :80, all on one private bridge network.
name: shopkart

services:
  user-service:
    build: ./services/user-service
    image: ${DOCKERHUB_USERNAME:-local}/shopkart-user-service:${IMAGE_TAG:-1.0.0}
    container_name: user-service
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    networks: [shopkart-net]
    restart: unless-stopped

  products-service:
    build: ./services/products-service
    image: ${DOCKERHUB_USERNAME:-local}/shopkart-products-service:${IMAGE_TAG:-1.0.0}
    container_name: products-service
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    networks: [shopkart-net]
    restart: unless-stopped

  orders-service:
    build: ./services/orders-service
    image: ${DOCKERHUB_USERNAME:-local}/shopkart-orders-service:${IMAGE_TAG:-1.0.0}
    container_name: orders-service
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    networks: [shopkart-net]
    restart: unless-stopped

  cart-service:
    build: ./services/cart-service
    image: ${DOCKERHUB_USERNAME:-local}/shopkart-cart-service:${IMAGE_TAG:-1.0.0}
    container_name: cart-service
    environment:
      PORT: 3004
    ports:
      - "3004:3004"
    networks: [shopkart-net]
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    image: ${DOCKERHUB_USERNAME:-local}/shopkart-frontend:${IMAGE_TAG:-1.0.0}
    container_name: frontend
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCTS_SERVICE_URL: http://products-service:3002
      ORDERS_SERVICE_URL: http://orders-service:3003
      CART_SERVICE_URL: http://cart-service:3004
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:3000"
      - "3000:3000"
    depends_on:
      user-service: { condition: service_healthy }
      products-service: { condition: service_healthy }
      orders-service: { condition: service_healthy }
      cart-service: { condition: service_healthy }
    networks: [shopkart-net]
    restart: unless-stopped

networks:
  shopkart-net:
    driver: bridge
